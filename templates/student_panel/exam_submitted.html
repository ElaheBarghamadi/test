<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>آزمون ثبت شد</title>
    <style>
        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">🎉</div>
    <h1>آزمون با موفقیت ثبت شد</h1>
    <p>پاسخ‌های شما برای آزمون {{ exam.title }} با موفقیت ذخیره شد.</p>
    <p>از شما متشکریم. نتیجه پس از تصحیح توسط معلم اعلام خواهد شد.</p>
    <a href="{% url 'student_dashboard' %}" class="btn">بازگشت به داشبورد</a>
</div>
</body>
</html>
