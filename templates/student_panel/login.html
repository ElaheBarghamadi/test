<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ورود دانش‌آموز</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            border-right: 3px solid #c33;
        }

        .info {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }

        .demo-credentials {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 12px;
            text-align: right;
        }

        .demo-credentials p {
            margin: 5px 0;
            color: #666;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">📚</div>
    <h1>سامانه آزمون غیرحضوری</h1>
    <div class="subtitle">ورود دانش‌آموزان</div>

    {% if error %}
    <div class="error">
        ❌ {{ error }}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="input-group">
            <label>نام کاربری</label>
            <input type="text" name="username" placeholder="مثلا: student1" required autofocus>
        </div>
        <div class="input-group">
            <label>رمز عبور</label>
            <input type="password" name="password" placeholder="رمز عبور ۵ رقمی" required>
        </div>
        <button type="submit">ورود به سامانه</button>
    </form>

    <div class="demo-credentials">
        <p>📌 برای تست:</p>
        <p>نام کاربری: student1</p>
        <p>رمز عبور: 12345</p>
    </div>

    <div class="info">
        <a href="/teacher/login/" style="color: #667eea; text-decoration: none;">ورود معلم‌ها</a>
    </div>
</div>
</body>
</html>
