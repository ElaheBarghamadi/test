<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>زمان آزمون تمام شد</title>
    <style>
        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f44336, #d32f2f);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #f44336;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }

        .btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⏰</div>
    <h1>زمان آزمون به پایان رسید</h1>
    <p>متأسفانه زمان مجاز برای پاسخگویی به سوالات {{ exam.title }} به اتمام رسیده است.</p>
    <p>پاسخ‌هایی که ثبت کرده‌اید ذخیره شده است.</p>
    <a href="{% url 'student_dashboard' %}" class="btn">بازگشت به داشبورد</a>
</div>
</body>
</html>
