<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>زمان آزمون تمام شد</title>
    <style>
    @font-face{font-family:'Vazirmatn';src:url('/static/fonts/Vazirmatn-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
    @font-face{font-family:'Vazirmatn';src:url('/static/fonts/Vazirmatn-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
    @font-face{font-family:'Vazirmatn';src:url('/static/fonts/Vazirmatn-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
    @font-face{font-family:'Vazirmatn';src:url('/static/fonts/Vazirmatn-ExtraBold.woff2') format('woff2');font-weight:800;font-display:swap}

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Vazirmatn', 'Segoe UI', Tahoma, system-ui, sans-serif;
        min-height: 100vh; display: flex; align-items: center; justify-content: center;
        padding: 20px 12px; color: #3d2c1c; line-height: 1.85;
        background-image:
            radial-gradient(rgba(140, 105, 20, .05) 1px, transparent 1.4px),
            linear-gradient(150deg, #f8f3e9 0%, #e9dfcb 100%);
        background-size: 22px 22px, auto;
    }

    .card {
        width: 100%; max-width: 500px; text-align: center;
        background: #fffdfa; border: 1px solid #e9dcc4; border-radius: 24px; padding: 30px 20px;
        box-shadow: 0 1px 2px rgba(80,55,30,.05), 0 14px 40px rgba(140,105,20,.14);
    }
    .icon { font-size: 4rem; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; font-weight: 800; color: #3d2c1c; margin-bottom: 10px; }
    p { font-size: .88rem; color: #6d543a; margin-bottom: 18px; }

    a, button { font-family: inherit; }
    .btn-primary, .btn-secondary, .btn-settings, .btn-cheats, .btn-answers,
    .btn-edit, .btn-delete, .btn-teacher-ans, .btn-save, .btn-danger,
    .btn-home, .btn-dashboard, .btn-yes, .btn-no, .btn-only {
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        border-radius: 999px; padding: 9px 18px; font-size: .82rem; font-weight: 700;
        text-decoration: none; cursor: pointer; border: 1.5px solid transparent; transition: .15s;
    }
    .btn-primary, .btn-save, .btn-yes, .btn-home, .btn-dashboard {
        background: linear-gradient(135deg, #c49a2b, #7d5d10); color: #fff;
        box-shadow: 0 5px 14px rgba(140, 105, 20, .25);
    }
    .btn-primary:hover, .btn-save:hover, .btn-yes:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .btn-secondary, .btn-no { background: #fdf7ec; color: #6d543a; border-color: #e9dcc4; }
    .btn-secondary:hover, .btn-no:hover { border-color: #c49a2b; color: #7d5d10; background: #fdf4de; }
    .btn-settings { background: #e7f6ec; color: #157a3b; border-color: #b9e2c6; }
    .btn-cheats { background: #fff3e0; color: #b96c07; border-color: #f3d3a4; }
    .btn-answers, .btn-edit, .btn-teacher-ans { background: #fdf4de; color: #7d5d10; border-color: #f0e0b8; }
    .btn-delete, .btn-danger { background: #fdecec; color: #bd2222; border-color: #f2c4c4; }
    .btn-edit, .btn-delete, .btn-teacher-ans { padding: 5px 11px; font-size: .78rem; }

    @media (max-width: 480px) { .card { padding: 22px 14px; } h1 { font-size: 1.15rem; } }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">⏰</div>
    <h1>زمان آزمون به پایان رسید</h1>
    <p>متأسفانه زمان مجاز برای پاسخگویی به سوالات {{ exam.title }} به اتمام رسیده است.</p>
    <p>پاسخ‌هایی که ثبت کرده‌اید ذخیره شده است.</p>
    <a href="{% url 'student_dashboard' %}" class="btn">بازگشت به داشبورد</a>
</div>
</body>
</html>
