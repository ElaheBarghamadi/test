<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8">
    <title>ممنون از امتحانت</title>
    <style>
        body {
            font-family: Tahoma, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            max-width: 550px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        h1 {
            color: #764ba2;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #666;
            line-height: 1.8;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 35px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .message {
            background: #f0f2f5;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">📚</div>
    <h1>ممنون از امتحانت!</h1>
    <div class="message">
        <p>✨ آفرین، عالی بودی ✨</p>
        <p>تلاش تو ارزشمند است. به خودت افتخار کن.</p>
    </div>
    <p>پاسخ‌های شما با موفقیت ثبت شد و برای معلم ارسال گردید.</p>
    <p>نتیجه نهایی پس از تصحیح اعلام خواهد شد.</p>
    <a href="{% url 'student_dashboard' %}" class="btn">بازگشت به صفحه اصلی</a>
</div>
</body>
</html>
